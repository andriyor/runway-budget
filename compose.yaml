services:
  api:
    build: { target: api }
    env_file:
      - path: api/.env
        required: false
    environment:
      # local time for the twice-daily Monobank sync (09:00 and 21:00)
      TZ: Europe/Kyiv
    volumes:
      - data:/data
    restart: unless-stopped
  web:
    build: { target: web }
    ports:
      - "8080:80"
    depends_on: [api]
    restart: unless-stopped
volumes:
  data:
